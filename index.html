<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Evidence Navigator · StepFun Agent Demo</title>
<style>:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif;background:#111316;color:#f3f1ea}body{max-width:950px;margin:0 auto;padding:45px 22px}small{color:#83d9cb;letter-spacing:.13em;text-transform:uppercase}h1{font-size:clamp(2rem,6vw,4rem);line-height:1.1;margin:.4em 0}p{color:#adb5b7;line-height:1.7}.card{background:#1c2024;border:1px solid #39434a;border-radius:18px;padding:24px;margin:22px 0}textarea{width:100%;box-sizing:border-box;min-height:190px;background:#101417;color:#fff;border:1px solid #58656c;border-radius:10px;padding:15px;font:inherit;line-height:1.55}button{border:0;border-radius:10px;background:#8ee5d4;color:#132020;padding:12px 19px;font:inherit;font-weight:700;cursor:pointer}button:disabled{opacity:.5}button.secondary{background:#343e43;color:#dce3e1;margin-right:8px}h2{font-size:1.1rem;color:#8ee5d4}li{margin:.65em 0;line-height:1.55}#error{color:#ffafa7}footer{color:#819091;font-size:.85rem;margin-top:30px}</style>
<small>EDGAR-OS · Agent Builder Program</small><h1>Evidence Navigator</h1><p>貼上專案工作紀錄，由 Step 3.7 Flash 協助分辨已有證據、仍待確認的狀態，並給出一個可驗收的下一步。</p>
<div class="card"><label for="notes"><strong>專案狀態與證據</strong></label><p>先試範例，再貼上你自己的非機密紀錄。</p><textarea id="notes">Knowledge Workbench：PR #4 已合併到 master；產品頁顯示「架設中」。YouTrack WB-4 標成 Fixed。有人建議直接宣稱搜尋功能已正式上線，但目前沒有公開搜尋結果的實際查詢截圖或當前正式部署驗證。下一步尚未排定。</textarea><p><button class="secondary" id="sample">載入範例</button><button id="run">請 Agent 分析</button></p><p id="error" role="alert"></p></div>
<div class="card" id="output" hidden><small>Step 3.7 Flash · Analysis</small><div id="details"></div></div>
<footer>每次分析會呼叫 StepFun API；API 金鑰只留在伺服器，不會傳到瀏覽器。模型輸出需以原始證據再驗證。</footer>
<script>const notes=document.querySelector("#notes"),error=document.querySelector("#error"),out=document.querySelector("#output"),details=document.querySelector("#details"),run=document.querySelector("#run"),example=notes.value;document.querySelector("#sample").onclick=()=>notes.value=example;function el(t,v){const n=document.createElement(t);n.textContent=v;return n}function section(t,v){details.append(el("h2",t));if(Array.isArray(v)){const u=el("ul","");v.forEach(x=>u.append(el("li",String(x))));details.append(u)}else details.append(el("p",String(v??"")))}run.onclick=async()=>{run.disabled=true;error.textContent="";out.hidden=true;details.replaceChildren();try{const r=await fetch("/api/analyze",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({notes:notes.value})}),d=await r.json();if(!r.ok)throw Error(d.error||"Request failed");const x=d.result;if(x.raw_response)section("模型原始回覆",x.raw_response);else{section("目前摘要",x.summary);section("紀錄中的證據",x.facts);section("仍未知",x.unknowns);section("下一個動作",x.next_action);section("怎麼驗收",x.verification)}out.hidden=false}catch(e){error.textContent=e.message}finally{run.disabled=false}};</script>
